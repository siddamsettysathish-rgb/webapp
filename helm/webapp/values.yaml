replicaCount: 3

image:
  repository: sathishsiddamsetty/webapp
  tag: "24"
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  LOG_LEVEL: "info"
  APP_ENV: "production"
  FEATURE_FLAG_X: "true"

ingress:
  enabled: false
  host: webapp.yourdomain.com
  tlsSecretName: webapp-tls

networkPolicy:
  enabled: true

revisionHistoryLimit: 3
